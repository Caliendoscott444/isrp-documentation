site_name: Iowa State Roleplay
site_description: Official Iowa State Roleplay documentation
site_url: https://YOUR-GITHUB-USERNAME.github.io/isrp-documentation/
repo_name: YOUR-GITHUB-USERNAME/isrp-documentation
repo_url: https://github.com/YOUR-GITHUB-USERNAME/isrp-documentation
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/isrp-logo.png
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Community Handbook: community-handbook.md
  - Punishment Guide: punishment-guide.md
  - Training Guide: training-guide.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; Iowa State Roleplay
